<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Bubblecall</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Bubblecall</a>
    <ul class="nav-links">
      <li><a href="login.html" id="nav-login">Login</a></li>
      <li><a href="register.html" id="nav-register">Register</a></li>
      <li><a href="dashboard.html" id="nav-dashboard" class="hidden">Dashboard</a></li>
      <li><a href="#" id="nav-logout" class="hidden" onclick="logout(); return false;">Logout</a></li>
      <li><span id="user-info" class="user-info"></span></li>
    </ul>
  </nav>

  <main>
    <div class="card auth-container">
      <h1>Register</h1>
      <p class="subtitle">Create your account to start hosting calls</p>
      <div id="register-msg" class="message hidden"></div>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Display Name</label>
          <input type="text" id="reg-name" maxlength="20" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" required autocomplete="new-password" />
        </div>
        <button type="submit" id="register-btn" class="btn btn-primary btn-block">Register</button>
      </form>
      <p class="auth-switch mt-2">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
